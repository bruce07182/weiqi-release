      if (hosted) content = content.replace('</head>', '<script>window.addEventListener("load",()=>{let last="";const tick=()=>{if(document.visibilityState!=="visible")return;const page=location.pathname+location.search+"#"+(document.querySelector("[aria-current=page]")?.textContent||document.querySelector(".page-number")?.textContent||"");if(page!==last){last=page;fetch("/api/access/event",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({kind:"pageview",page})}).catch(()=>{});} };tick();setInterval(()=>{tick();if(document.visibilityState==="visible")fetch("/api/access/event",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({kind:"heartbeat",page:last})}).catch(()=>{});},60000);});<\/script></head>');
      document.open(); document.write(content); document.close();
    } catch (error) {
      $('status').textContent = error.message;
      $('password').focus();
    } finally { $('unlockButton') && ($('unlockButton').disabled = false); }
  };
  try { await coversReady; }
  catch (error) { $('status').textContent = 'Unable to load the cover: ' + error.message; }
})();
</script></body></html>
