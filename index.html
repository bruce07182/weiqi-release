      document.open(); document.write(content); document.close();
    } catch (error) {
      $('status').textContent = error.message;
      $('password').focus();
    } finally { $('unlockButton') && ($('unlockButton').disabled = false); }
  };
  try { await coversReady; }
  catch (error) { $('status').textContent = 'Unable to load the cover: ' + error.message; }
})();
